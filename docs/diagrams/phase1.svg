<svg xmlns="http://www.w3.org/2000/svg" width="780" height="1104" viewBox="0 0 780 1104" role="img" aria-label="Part A: a lecture video is split into what was said and what was shown, and the two are matched slide by slide.">
<title>Part A: a lecture video is split into what was said and what was shown, and the two are matched slide by slide.</title>
