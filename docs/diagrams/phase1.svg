<text x="444" y="224.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="440" y="350" width="300" height="112" rx="14" fill="#FFFFFF" stroke="#4A78C8" stroke-width="2"/>
<circle cx="478" cy="406.0" r="22" fill="#4A78C8"/>
<g transform="translate(478,406.0) scale(1.0)"><text x="0" y="6" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF">Aa</text></g>
<text x="514" y="378" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1F2A37">Read the slide text (OCR)</text>
<text x="514" y="398" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4D5A6D">Read the words on every picture.</text>
<text x="514" y="450" font-family="Consolas, Menlo, Courier New, monospace" font-size="11" font-weight="normal" fill="#2A4F8C">Tesseract</text>
