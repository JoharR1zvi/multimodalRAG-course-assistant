<text x="42" y="202" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#2A4F8C">WHAT WAS SAID</text>
<rect x="424" y="176" width="332" height="572" rx="18" fill="#E8F0FE" fill-opacity="0.65"/>
<text x="442" y="202" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#2A4F8C">WHAT WAS SHOWN</text>
<rect x="40" y="216" width="300" height="112" rx="14" fill="#FFFFFF" stroke="#4A78C8" stroke-width="2"/>
<circle cx="78" cy="272.0" r="22" fill="#4A78C8"/>
<g transform="translate(78,272.0) scale(1.0)"><rect x="-11.5" y="-3.0" width="3" height="6" rx="1.5" fill="#FFFFFF"/><rect x="-6.5" y="-7.0" width="3" height="14" rx="1.5" fill="#FFFFFF"/><rect x="-1.5" y="-11.0" width="3" height="22" rx="1.5" fill="#FFFFFF"/><rect x="3.5" y="-6.0" width="3" height="12" rx="1.5" fill="#FFFFFF"/><rect x="8.5" y="-3.0" width="3" height="6" rx="1.5" fill="#FFFFFF"/></g>
<text x="114" y="244" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1F2A37">Extract the audio</text>
<text x="114" y="264" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4D5A6D">Pull the sound track out of the</text>
<text x="114" y="280" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4D5A6D">video.</text>
<text x="114" y="316" font-family="Consolas, Menlo, Courier New, monospace" font-size="11" font-weight="normal" fill="#2A4F8C">FFmpeg</text>
<circle cx="44" cy="220" r="14" fill="#2A4F8C" stroke="#FFFFFF" stroke-width="2.5"/>
<text x="44" y="224.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="40" y="350" width="300" height="112" rx="14" fill="#FFFFFF" stroke="#4A78C8" stroke-width="2"/>
<circle cx="78" cy="406.0" r="22" fill="#4A78C8"/>
<g transform="translate(78,406.0) scale(1.0)"><rect x="-8" y="-11" width="16" height="22" rx="2" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M-4,-5 H4 M-4,0 H4 M-4,5 H1" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="114" y="378" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1F2A37">Write down the speech</text>
<text x="114" y="398" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4D5A6D">Turn the speech into text, with</text>
<text x="114" y="414" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4D5A6D">the start and end time of every</text>
<text x="114" y="430" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4D5A6D">sentence.</text>
<text x="114" y="450" font-family="Consolas, Menlo, Courier New, monospace" font-size="11" font-weight="normal" fill="#2A4F8C">Faster-Whisper on the GPU</text>
<circle cx="44" cy="354" r="14" fill="#2A4F8C" stroke="#FFFFFF" stroke-width="2.5"/>
<text x="44" y="358.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="440" y="216" width="300" height="112" rx="14" fill="#FFFFFF" stroke="#4A78C8" stroke-width="2"/>
