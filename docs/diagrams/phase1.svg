<text x="214" y="966" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1F2A37">Knowledge objects: one record per slide</text>
<text x="214" y="986" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4D5A6D">Each record holds the slide text, a description of any diagram,</text>
<text x="214" y="1002" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4D5A6D">what was said while it was shown, and the exact times.</text>
