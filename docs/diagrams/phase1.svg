<text x="64" y="72" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#2A4F8C">the lecture</text>
<text x="64" y="94" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#4D5A6D">pipeline stages 1 to 8</text>
