<text x="514" y="512" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1F2A37">Describe each slide</text>
<text x="514" y="532" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4D5A6D">Each picture goes to Gemini (a</text>
<text x="514" y="548" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4D5A6D">cloud service), which gives the</text>
<text x="514" y="564" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4D5A6D">title and describes diagrams.</text>
<text x="514" y="584" font-family="Consolas, Menlo, Courier New, monospace" font-size="11" font-weight="normal" fill="#2A4F8C">Gemini (cloud API)</text>
<circle cx="444" cy="488" r="14" fill="#2A4F8C" stroke="#FFFFFF" stroke-width="2.5"/>
<text x="444" y="492.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">5</text>
<rect x="440" y="618" width="300" height="112" rx="14" fill="#FFFFFF" stroke="#4A78C8" stroke-width="2"/>
<circle cx="478" cy="674.0" r="22" fill="#4A78C8"/>
<g transform="translate(478,674.0) scale(1.0)"><path d="M-10,-9 H10 L3,0 V9 L-3,6 V0 Z" fill="#FFFFFF"/></g>
<text x="514" y="646" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1F2A37">Clean up the text</text>
<text x="514" y="666" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4D5A6D">Remove words that repeat on every</text>
<text x="514" y="682" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4D5A6D">slide (menus) and characters OCR</text>
<text x="514" y="698" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4D5A6D">was unsure about.</text>
<text x="514" y="718" font-family="Consolas, Menlo, Courier New, monospace" font-size="11" font-weight="normal" fill="#2A4F8C">repeated-word filter</text>
