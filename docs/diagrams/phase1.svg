<text x="314" y="50" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1F2A37">Lecture video</text>
<text x="314" y="70" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4D5A6D">A recording of one lecture, stored</text>
<text x="314" y="86" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4D5A6D">as a file on your computer.</text>
<text x="314" y="110" font-family="Consolas, Menlo, Courier New, monospace" font-size="11" font-weight="normal" fill="#2A4F8C">data/raw/&lt;lecture&gt;/</text>
