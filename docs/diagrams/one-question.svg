<rect x="690" y="233.0" width="8" height="9.0" rx="2" fill="#DB8A33"/>
<rect x="702" y="242" width="8" height="6.0" rx="2" fill="#DB8A33" fill-opacity="0.55"/>
<rect x="714" y="224.0" width="8" height="18.0" rx="2" fill="#DB8A33"/>
