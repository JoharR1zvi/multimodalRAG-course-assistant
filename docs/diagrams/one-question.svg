<g transform="translate(78,348) scale(1.0)"><ellipse cx="0" cy="-7" rx="9" ry="3.5" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M-9,-7 V7 A9,3.5 0 0 0 9,7 V-7" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M-9,0 A9,3.5 0 0 0 9,0" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="114" y="340" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="bold" fill="#1F2A37">The database returns the 5 closest chunks</text>
<circle cx="44" cy="314" r="14" fill="#176654" stroke="#FFFFFF" stroke-width="2.5"/>
<text x="44" y="318.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">C3</text>
<text x="114" y="364" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4D5A6D">Similar meaning gives similar numbers, so the closest numbers point to the most relevant parts of</text>
<text x="114" y="381" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4D5A6D">the lecture.</text>
<text x="150" y="416" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#176654">closeness (1.0 = same meaning)</text>
<text x="384" y="416" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#176654">lecture</text>
<text x="514" y="416" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#176654">time range</text>
<text x="114" y="440" font-family="Consolas, Menlo, Courier New, monospace" font-size="12.5" font-weight="bold" fill="#176654">[1]</text>
<rect x="150" y="428" width="160" height="14" rx="7" fill="#EEF1F5"/>
<rect x="150" y="428" width="98.08" height="14" rx="7" fill="#2E9C85"/>
<text x="320" y="440" font-family="Consolas, Menlo, Courier New, monospace" font-size="12.5" font-weight="normal" fill="#1F2A37">0.613</text>
<text x="384" y="440" font-family="Consolas, Menlo, Courier New, monospace" font-size="12.5" font-weight="normal" fill="#1F2A37">lecture_01</text>
<text x="514" y="440" font-family="Consolas, Menlo, Courier New, monospace" font-size="12.5" font-weight="normal" fill="#1F2A37">12:31 - 15:06</text>
<text x="114" y="468" font-family="Consolas, Menlo, Courier New, monospace" font-size="12.5" font-weight="bold" fill="#176654">[2]</text>
<rect x="150" y="456" width="160" height="14" rx="7" fill="#EEF1F5"/>
<rect x="150" y="456" width="95.84" height="14" rx="7" fill="#2E9C85"/>
<text x="320" y="468" font-family="Consolas, Menlo, Courier New, monospace" font-size="12.5" font-weight="normal" fill="#1F2A37">0.599</text>
<text x="384" y="468" font-family="Consolas, Menlo, Courier New, monospace" font-size="12.5" font-weight="normal" fill="#1F2A37">lecture_01</text>
<text x="514" y="468" font-family="Consolas, Menlo, Courier New, monospace" font-size="12.5" font-weight="normal" fill="#1F2A37">14:58 - 18:03</text>
<text x="114" y="498" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4D5A6D">[3] to [5]: three more chunks</text>
<text x="114" y="524" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#4D5A6D">Each hit comes with its lecture, times and slide titles, because they are stored next to its numbers.</text>
<text x="114" y="542" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#4D5A6D">Neighbouring chunks overlap a little, on purpose.</text>
<rect x="40" y="584" width="720" height="156" rx="14" fill="#FFFFFF" stroke="#DB8A33" stroke-width="2"/>
<circle cx="78" cy="622" r="22" fill="#DB8A33"/>
<g transform="translate(78,622) scale(1.0)"><path d="M0,-11 L2.5,-2.5 L11,0 L2.5,2.5 L0,11 L-2.5,2.5 L-11,0 L-2.5,-2.5 Z" fill="#FFFFFF"/></g>
<text x="114" y="614" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="bold" fill="#1F2A37">Gemini writes the answer from those 5 chunks only</text>
<circle cx="44" cy="588" r="14" fill="#94500B" stroke="#FFFFFF" stroke-width="2.5"/>
<text x="44" y="592.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">C4</text>
<rect x="114" y="628" width="620" height="50" rx="12" fill="#FDEEDD"/>
<text x="130" y="650" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1F2A37">A confusion matrix counts the four ways a classifier can be right or wrong. [1][2]</text>
<text x="130" y="668" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#4D5A6D" font-style="italic">(example wording)</text>
<text x="114" y="702" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4D5A6D">It may only cite the chunk numbers [1] to [5].</text>
<text x="114" y="722" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#94500B">It never writes a lecture name or a time.</text>
<rect x="40" y="770" width="720" height="184" rx="14" fill="#FDEEDD" stroke="#DB8A33" stroke-width="2"/>
<circle cx="78" cy="808" r="22" fill="#DB8A33"/>
<g transform="translate(78,808) scale(1.0)"><path d="M-9,0 L-3,6 L9,-7" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"/></g>
<text x="114" y="800" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="bold" fill="#1F2A37">Our code checks the citations and builds the sources</text>
<circle cx="44" cy="774" r="14" fill="#94500B" stroke="#FFFFFF" stroke-width="2.5"/>
<text x="44" y="778.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">C5</text>
<text x="114" y="830" font-family="Consolas, Menlo, Courier New, monospace" font-size="12" font-weight="normal" fill="#1F2A37">[1]  lecture_01  12:31 - 15:06  Classification metrics | Confusion matrix</text>
<text x="114" y="850" font-family="Consolas, Menlo, Courier New, monospace" font-size="12" font-weight="normal" fill="#1F2A37">[2]  lecture_01  14:58 - 18:03  Confusion matrix</text>
<text x="114" y="880" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1F2A37">Example values. Looked up in the stored chunks, not written by the model. Each source also</text>
<text x="114" y="897" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1F2A37">points to the first slide picture of that stretch. A citation to a chunk that does not</text>
<text x="114" y="914" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1F2A37">exist, such as [9], is removed and a warning is shown.</text>
