<g transform="translate(78,62) scale(1.0)"><text x="0" y="8" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF">?</text></g>
<text x="114" y="54" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="bold" fill="#1F2A37">You ask</text>
<circle cx="44" cy="28" r="14" fill="#94500B" stroke="#FFFFFF" stroke-width="2.5"/>
<text x="44" y="32.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">C1</text>
<rect x="114" y="68" width="420" height="34" rx="17" fill="#FDEEDD"/>
<text x="132" y="90" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#1F2A37">What is a confusion matrix?</text>
<rect x="40" y="146" width="720" height="134" rx="14" fill="#FFFFFF" stroke="#DB8A33" stroke-width="2"/>
<circle cx="78" cy="184" r="22" fill="#DB8A33"/>
<g transform="translate(78,184) scale(1.0)"><circle cx="-7" cy="-7" r="1.9" fill="#FFFFFF"/><circle cx="-7" cy="0" r="1.9" fill="#FFFFFF"/><circle cx="-7" cy="7" r="1.9" fill="#FFFFFF"/><circle cx="0" cy="-7" r="1.9" fill="#FFFFFF"/><circle cx="0" cy="0" r="1.9" fill="#FFFFFF"/><circle cx="0" cy="7" r="1.9" fill="#FFFFFF"/><circle cx="7" cy="-7" r="1.9" fill="#FFFFFF"/><circle cx="7" cy="0" r="1.9" fill="#FFFFFF"/><circle cx="7" cy="7" r="1.9" fill="#FFFFFF"/></g>
<text x="114" y="176" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="bold" fill="#1F2A37">It becomes a list of numbers</text>
<circle cx="44" cy="150" r="14" fill="#94500B" stroke="#FFFFFF" stroke-width="2.5"/>
<text x="44" y="154.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">C2</text>
<text x="114" y="200" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4D5A6D">The same model that turned the chunks into numbers does this for the question.</text>
<text x="114" y="230" font-family="Consolas, Menlo, Courier New, monospace" font-size="13.5" font-weight="normal" fill="#1F2A37">[ 0.12   -0.40   0.07   0.31   ...   -0.05 ]</text>
<text x="114" y="254" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#4D5A6D">1,024 numbers in total: a numeric summary of what the question means</text>
