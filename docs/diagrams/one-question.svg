<svg xmlns="http://www.w3.org/2000/svg" width="800" height="978" viewBox="0 0 800 978" role="img" aria-label="Part C with one example question: it becomes numbers, the closest chunks are found, Gemini answers from them, and the sources are looked up.">
<title>Part C with one example question: it becomes numbers, the closest chunks are found, Gemini answers from them, and the sources are looked up.</title>
<rect x="0.5" y="0.5" width="799" height="977" rx="16" fill="#FFFFFF" stroke="#D8DEE8"/>
<rect x="40" y="24" width="720" height="92" rx="14" fill="#FFFFFF" stroke="#DB8A33" stroke-width="2"/>
